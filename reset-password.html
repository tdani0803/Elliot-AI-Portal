<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#95d3ee" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ElliotAI" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" />
  <script>
    // If anything breaks while loading, say so on screen instead of leaving a dead page.
    (function () {
      function show(detail) {
        if (document.getElementById('fatal')) return;
        var box = document.createElement('p');
        box.id = 'fatal';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;inset:16px 16px auto;z-index:99;margin:0;padding:14px 16px;background:#fde4e1;border:3px solid #111418;border-radius:12px;font:600 16px/1.4 system-ui,sans-serif;color:#111418';
        box.textContent = 'Sorry, this page didn\'t load properly. Please refresh. If it keeps happening, contact ElliotAI. (Details: ' + detail + ')';
        (document.body || document.documentElement).prepend(box);
      }
      window.addEventListener('error', function (e) { if (e.message) show(e.message); });
      window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || String(e.reason)); });
    })();
  </script>
  <title>Set password · ElliotAI</title>
</head>
<body>
  <main class="auth">
    <div class="auth__wrap">
    <img class="auth__logo" src="/logo.png" alt="ElliotAI" width="260" height="66" />
    <div class="card auth__card">
      <h1 class="auth__title">Set your password</h1>
      <p class="auth__lead" id="status" role="status">Checking your link…</p>
      <p class="notice notice--error" id="error" role="alert" hidden></p>
      <form class="auth__form" id="reset-form" method="post" novalidate hidden>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn btn--block" type="submit">Save password</button>
      </form>
      <p class="auth__links"><a href="/forgot-password.html" id="forgot-link" hidden>Forgot password?</a></p>
      <p class="auth__links"><a href="/">Back to log in</a></p>
    </div>
    </div>
  </main>
  <script type="module" src="/src/pages/reset.js"></script>
</body>
</html>
