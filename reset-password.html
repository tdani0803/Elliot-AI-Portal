<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7fc4e0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  <title>Set password · ElliotAI</title>
</head>
<body>
  <main class="auth">
    <div class="card auth__card">
      <img class="auth__logo" src="/logo.svg" alt="ElliotAI" width="190" height="51" />
      <h1 class="auth__title">Set your password</h1>
      <p class="notice notice--error" id="error" role="alert" hidden></p>
      <form class="auth__form" id="reset-form" novalidate hidden>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn btn--block" type="submit">Save password</button>
      </form>
      <p class="auth__links"><a href="/">Back to log in</a></p>
    </div>
  </main>
  <script type="module" src="/src/pages/reset.js"></script>
</body>
</html>
