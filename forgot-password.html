<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#95d3ee" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" />
  <title>Reset password · ElliotAI</title>
</head>
<body>
  <main class="auth">
    <div class="auth__wrap">
    <img class="auth__logo" src="/logo.png" alt="ElliotAI" width="260" height="66" />
    <div class="card auth__card">
      <h1 class="auth__title">Forgot password?</h1>
      <p class="auth__lead">Pop your email in and we'll send you a link to set a new one.</p>
      <p class="notice notice--error" id="error" role="alert" hidden></p>
      <p class="notice notice--ok" id="ok" role="status" hidden></p>
      <form class="auth__form" id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
        </div>
        <button class="btn btn--block" type="submit">Send reset link</button>
      </form>
      <p class="auth__links"><a href="/">Back to log in</a></p>
    </div>
    </div>
  </main>
  <script type="module" src="/src/pages/forgot.js"></script>
</body>
</html>
